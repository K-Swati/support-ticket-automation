name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: End-to-end demo (mocked AWS)
        run: python scripts/demo.py
      - name: Train model and publish the evaluation report
        run: python -m pipeline train
      - uses: actions/upload-artifact@v4
        with:
          name: classifier-report
          path: reports/
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t support-ticket-automation .
